    <script>
        document.getElementById('form1').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const username = document.getElementById('exampleInputEmail1').value;
            const password = document.getElementById('inputPasswordLogin').value;
            
            try {
                // This is where you'll make the API call to your backend
                // For now, using demo validation
                // Replace this with actual API call when backend is ready
                /* Example of how it will look with backend:

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    // Handle successful login
                } else {
                    // Handle login error
                }
                */

                // Demo validation - replace this with actual API call
                if (username === 'admin' && password === 'admin') {
                    await Swal.fire({
                        title: 'Success!',
                        text: 'Login successful',
                        icon: 'success',
                        confirmButtonColor: '#000000'
                    });
                    window.location.href = 'index.html';
                } else {
                    throw new Error('Invalid credentials');
                }
            } catch (error) {
                Swal.fire({
                    title: 'Error!',
                    text: error.message || 'Invalid username or password',
                    icon: 'error',
                    confirmButtonColor: '#000000'
                });
            }
        });

        // Toggle password visibility
        document.getElementById('eye-icon-login').addEventListener('click', function() {
            const passwordInput = document.getElementById('inputPasswordLogin');
            const eyeSlash = document.getElementById('eye-slash-login');
            const eyeOpen = document.getElementById('eye-open-login');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeSlash.classList.add('d-none');
                eyeOpen.classList.remove('d-none');
            } else {
                passwordInput.type = 'password';
                eyeSlash.classList.remove('d-none');
                eyeOpen.classList.add('d-none');
            }
        });
    </script>
