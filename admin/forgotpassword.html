    <div class="main-wrapper forgot-password-page">
        <div class="content forgot-password-content">
            <div class="container mt-5 mb-5">
                <div class="row">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body p-5">
                                <form id="forgotPasswordForm" onsubmit="return handleForgotPassword(event)">
                                    <div class="mb-4">
                                        <label for="email" class="form-label fw-bold" style="color: black;">Email Address</label>
                                        <input type="email" class="form-control" id="email" required 
                                            style="color: black; border: 2px solid black; padding: 12px;">

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../lib/wow/wow.min.js"></script>

    <script src="../lib/owlcarousel/owl.carousel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Password visibility toggle for login modal
        document.getElementById('eye-icon-login').addEventListener('click', function() {
            const passwordInput = document.getElementById('inputPasswordLogin');
            const eyeSlash = document.getElementById('eye-slash-login');
            const eyeOpen = document.getElementById('eye-open-login');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeSlash.classList.add('d-none');
                eyeOpen.classList.remove('d-none');
            } else {
                passwordInput.type = 'password';
                eyeSlash.classList.remove('d-none');
                eyeOpen.classList.add('d-none');
            }
        });

        // Password visibility toggle for register modal
        document.getElementById('eye-icon-register').addEventListener('click', function() {
            const passwordInput = document.getElementById('inputPasswordRegister');
            const eyeSlash = document.getElementById('eye-slash-register');
            const eyeOpen = document.getElementById('eye-open-register');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeSlash.classList.add('d-none');
                eyeOpen.classList.remove('d-none');
            } else {
                passwordInput.type = 'password';
                eyeSlash.classList.remove('d-none');
                eyeOpen.classList.add('d-none');
            }
        });

        // Show modal on page load
        window.addEventListener('load', function() {
            const loginModal = new bootstrap.Modal(document.getElementById('LOGINMODAL'));
            loginModal.show();
        });
    </script>
        <script>
            function handleForgotPassword(event) {
                event.preventDefault();
                
                const email = document.getElementById('email').value;
                
                // Store email in session storage for the next steps
                sessionStorage.setItem('resetEmail', email);
                
                // Show success message using SweetAlert2
                Swal.fire({
                    title: 'Verification Code Sent!',
                    text: 'Please check your email for the verification code.',
                    icon: 'success',
                    confirmButtonColor: '#3085d6',
                    confirmButtonText: 'OK'
                }).then((result) => {
                    if (result.isConfirmed) {
                        // Redirect to enter pin page
                        window.location.href = 'enterpin.html';
                    }
                });
                
                return false;
            }
        </script>
    <!-- Template Javascript -->
    <script src="../js/main.js"></script>
