        <script>
          document.addEventListener('DOMContentLoaded', function() {
            const deleteToggleBtn = document.getElementById('deleteToggleBtn');
            const partnerContainers = document.querySelectorAll('.position-relative');
            let deleteMode = false;

            // Toggle delete mode
            deleteToggleBtn.addEventListener('click', function() {
              deleteMode = !deleteMode;
              partnerContainers.forEach(container => {
                if (deleteMode) {
                  container.classList.add('show-delete');
                } else {
                  container.classList.remove('show-delete');
                }
              });
            });

            // Add click event listeners to all delete overlays
            document.addEventListener('click', function(e) {
              if (e.target.classList.contains('delete-overlay')) {
                e.preventDefault();
                const container = e.target.closest('.position-relative');
                const partnerImage = container.querySelector('img');
                const partnerName = partnerImage.alt;
                
                Swal.fire({
                  title: 'Delete Partnership?',
                  text: `Are you sure you want to remove this partnership?`,
                  icon: 'warning',
                  showCancelButton: true,
                  iconColor:'#8C0402',
                  confirmButtonColor: '#000',
                  cancelButtonColor: '#d33',
                  confirmButtonText: 'Yes, delete it!'
                }).then((result) => {
                  if (result.isConfirmed) {
                    // Here you can add your backend API call
                    // const partnerId = container.dataset.partnerId;
                    // await fetch('/api/partners/' + partnerId, { method: 'DELETE' });
                    
                    Swal.fire({
                      title: 'Deleted!',
                      text: 'The partnership has been removed.',
                      icon: 'success',
                      confirmButtonColor: '#000'
                    }).then(() => {
                      container.remove();
                      
                      // If no more items except the add button, turn off delete mode
                      if (document.querySelectorAll('.position-relative').length <= 1) {
                        deleteMode = false;
                        deleteToggleBtn.classList.remove('active');
                      }
                    });
                  }
                });
              }
            });

            // Handle file selection
            document.getElementById('addPartnerInput').addEventListener('change', function(e) {
              if (this.files && this.files[0]) {

              }
            });
          });
