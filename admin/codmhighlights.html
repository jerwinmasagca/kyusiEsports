      document.addEventListener('DOMContentLoaded', function() {
          // Get the post/add button (adjust the selector based on your button's ID)
          const postButton = document.querySelector('.btn-light.px-4') || document.getElementById('postButton');
          
          if (postButton) {
              postButton.addEventListener('click', function() {
                  // Get the form fields - adjust these based on your form's input IDs
                  const title = document.getElementById('postTitle')?.value || '';
                  const content = document.getElementById('postContent')?.value || '';
                  const requiredFields = document.querySelectorAll('[required]');
                  let hasEmptyFields = false;
  
                  // Check if any required fields are empty
                  requiredFields.forEach(field => {
                      if (!field.value) {
                          hasEmptyFields = true;
                      }
                  });
  
                  if (hasEmptyFields) {
                      Swal.fire({
                          icon: 'error',
                          title: 'Oops...',
                          text: 'Please fill in all required fields!',
                          confirmButtonColor: '#000'
                      });
                      return;
                  }
  
                  Swal.fire({
                      title: 'Add New Item?',
                      text: "Are you sure you want to add this item?",
                      icon: 'question',
                      showCancelButton: true,
                      confirmButtonColor: '#000',
                      cancelButtonColor: '#d33',
                      confirmButtonText: 'Yes, add it!'
                  }).then((result) => {
                      if (result.isConfirmed) {
                          Swal.fire({
                              title: 'Added!',
                              text: 'Your item has been added successfully.',
                              icon: 'success',
                              confirmButtonColor: '#000'
                          }).then(() => {
                              // Clear form and close modal
                              const form = document.querySelector('form');
                              if (form) form.reset();
                              
                              // Reset any image previews
                              const preview = document.getElementById('imagePreview');
                              if (preview) {
                                  preview.src = '';
                                  preview.style.display = 'none';
                              }
                              
                              // Close the modal
                              const closeButton = document.querySelector('#addPostModal .btn-close');
                              if (closeButton) closeButton.click();
                          });
                      }
                  });
              });
          }
      });
  </script>

        deleteMode = !deleteMode;
        videoContainers.forEach(container => {
            if (deleteMode) {
                container.classList.add('show-delete');
            } else {
                container.classList.remove('show-delete');
            }
        });
    });

    // Add click event listeners to all delete overlays
    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('delete-overlay')) {
            e.preventDefault();
            const container = e.target.closest('.video-container-wrapper');
            
            Swal.fire({
                title: 'Delete Video?',
                text: 'Are you sure you want to delete this video?',
                icon: 'warning',
                showCancelButton: true,
                iconColor:'#8C0402',
                confirmButtonColor: '#000',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Yes, delete it!'
            }).then((result) => {
                if (result.isConfirmed) {
                    // Here you can add your backend API call
                    // const videoId = container.dataset.videoId;
                    // await fetch('/api/videos/' + videoId, { method: 'DELETE' });
                    
                    Swal.fire({
                        title: 'Deleted!',
                        text: 'The video has been removed.',
                        icon: 'success',
                        confirmButtonColor: '#000'
                    }).then(() => {
                        container.remove();
                        
                        // If no more items, turn off delete mode
                        if (document.querySelectorAll('.video-container-wrapper').length === 0) {
                            deleteMode = false;
                            deleteToggleBtn.classList.remove('active');
                        }
                    });
                }
            });
        }
    });
});
</script>
</html>
