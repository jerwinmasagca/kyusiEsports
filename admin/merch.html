<script>
  document.addEventListener('DOMContentLoaded', function() {
    const deleteToggleBtn = document.getElementById('deleteToggleBtn');
    const imageContainers = document.querySelectorAll('.col-xl-4');
    let deleteMode = false;

    deleteToggleBtn.addEventListener('click', function() {
      deleteMode = !deleteMode;
      imageContainers.forEach(container => {
        if (deleteMode) {
          container.classList.add('show-delete');
        } else {
          container.classList.remove('show-delete');
        }
      });
    });

    // Add click event listeners to all delete overlays
    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('delete-overlay')) {
        e.preventDefault();
        const container = e.target.closest('.col-xl-4');
        const merchName = container.querySelector('h1').textContent;
        
        Swal.fire({
          title: 'Delete Merchandise?',
          text: `Are you sure you want to delete "${merchName}"?`,
          icon: 'warning',
          showCancelButton: true,
          iconColor:'#8C0402',
          confirmButtonColor: '#000',
          cancelButtonColor: '#d33',
          confirmButtonText: 'Yes, delete it!'
        }).then((result) => {
          if (result.isConfirmed) {
            // Here you can add your backend API call
            // const merchId = container.dataset.merchId;
            // await fetch('/api/merch/' + merchId, { method: 'DELETE' });
            
            Swal.fire({
              title: 'Deleted!',
              text: 'The merchandise has been removed.',
              icon: 'success',
              confirmButtonColor: '#000'
            }).then(() => {
              container.remove();
              
              // If no more items, turn off delete mode
              if (document.querySelectorAll('.col-xl-4').length === 0) {
                deleteMode = false;
                deleteToggleBtn.classList.remove('active');
              }
            });
          }
        });
      }
    });
  });
</script>
<script>
  // Handle post button clicks
  document.getElementById('postButton').addEventListener('click', function() {
    const title = document.getElementById('postTitle').value;
    const imageInput = document.getElementById('profileImageInput');

    if (!title || !imageInput.files[0]) {
      Swal.fire({
        icon: 'error',
        title: 'Oops...',
        text: 'Please fill in the merch name and upload an image!',
        confirmButtonColor: '#000'
      });
      return;
    }

    Swal.fire({
      title: 'Post Merchandise?',
      text: "Are you sure you want to post this merchandise?",
      icon: 'question',
      showCancelButton: true,
      confirmButtonColor: '#000',
      cancelButtonColor: '#d33',
      confirmButtonText: 'Yes, post it!'
    }).then((result) => {
      if (result.isConfirmed) {
        Swal.fire({
          title: 'Posted!',
          text: 'Your merchandise has been posted successfully.',
          icon: 'success',
          confirmButtonColor: '#000'
        }).then(() => {
          // Clear form and close modal
          document.getElementById('postTitle').value = '';
          document.getElementById('profileImageInput').value = '';
          document.getElementById('capsuleText').value = '';
          document.getElementById('publishCheck').checked = false;
          document.querySelector('#addPostModal .btn-close').click();
        });
      }
    });
  });
</script>
